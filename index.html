<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e7" />
    <title>Squishdoku — 7×7 Sudoku</title>
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation"><a class="active" href="/">Generate</a><a href="/custom-build/">Custom build</a></nav>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Squishdoku</h1>
        <button id="generate" type="button">
          <span class="button-mark" aria-hidden="true">✦</span>
          Generate two grids
        </button>
        <p id="status" class="status" aria-live="polite">Ready when you are.</p>
      </section>
      <div class="boards">
        <section class="puzzle-card" aria-label="Completed Squishdoku grid">
          <div class="card-topline"><span>Completed grid</span><button class="copy-button" type="button" data-copy="solution">Copy grid</button></div>
          <div id="solution-grid" class="grid" role="grid" aria-label="Completed Squishdoku grid"></div>
        </section>
        <section class="puzzle-card" aria-label="Dug Squishdoku puzzle">
          <div class="card-topline"><span>Final dug puzzle</span><button class="copy-button" type="button" data-copy="puzzle">Copy grid</button></div>
          <div id="puzzle-grid" class="grid" role="grid" aria-label="Uniquely solvable Squishdoku puzzle"></div>
          <div class="legend"><i aria-hidden="true"></i><span>Dashed lines mark the squish seams</span></div>
        </section>
      </div>
    </main>
    <footer>Rows, columns, and every overlapping 3×3 region contain no repeats.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
