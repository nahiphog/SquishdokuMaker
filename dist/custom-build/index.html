<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e7" />
    <title>Custom build — Squishdoku</title>
    <script type="module" crossorigin src="/SquishdokuMaker/assets/customBuild-C1_Pjff-.js"></script>
    <link rel="modulepreload" crossorigin href="/SquishdokuMaker/assets/style-Cjrv03aY.js">
    <link rel="modulepreload" crossorigin href="/SquishdokuMaker/assets/set-tuples-DgyoBLzL.js">
    <link rel="modulepreload" crossorigin href="/SquishdokuMaker/assets/walkthrough-Cf2OdGL8.js">
    <link rel="stylesheet" crossorigin href="/SquishdokuMaker/assets/style-CBUCTScW.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation"><details class="nav-menu"><summary>Pages</summary><div><a href="../">Generate</a><a class="active" href="../custom-build/">Custom build</a><a href="../verify/">Verify</a><a href="../simulation/">Simulation</a><a href="../simulation-pattern/">Simulation pattern</a><a href="../simlation-steps/">Simulation Difficulty</a><a href="../simulation-steps/">Simulation steps</a><a href="../techniques/">Techniques</a></div></details></nav>
    <main class="custom-shell">
      <section class="puzzle-card custom-card" aria-label="Custom Squishdoku grid">
        <div class="card-topline"><span>Choose clues</span><span id="filled-count">0 cells filled</span></div>
        <div id="custom-grid" class="grid custom-grid" role="grid" aria-label="Empty Squishdoku grid; select cells to highlight them"></div>
        <p id="highlighted-cells" class="selected-cells" aria-live="polite">Highlighted cells: none</p>
        <div class="difficulty-constraint" aria-label="Difficulty rating constraint">
          <label>Difficulty rating from
            <select id="difficulty-min">
              <option value="0">0</option>
              <option value="300">300</option>
              <option value="500">500</option>
              <option value="800">800</option>
              <option value="1000">1000</option>
              <option value="2000">2000</option>
            </select>
          </label>
          <span>to</span>
          <label>
            <select id="difficulty-max" aria-label="Maximum difficulty rating">
              <option value="500">500</option>
              <option value="1000">1000</option>
              <option value="2000">2000</option>
              <option value="10000">10000</option>
              <option value="100000" selected>100000</option>
            </select>
          </label>
        </div>
        <div class="build-controls">
          <button id="build-now" type="button">Build now</button>
          <button id="halt-build" class="secondary-button" type="button" disabled>Halt build</button>
          <button id="clear-highlights" class="copy-button" type="button">Remove highlights</button>
        </div>
        <p id="build-status" class="status" aria-live="polite">Choose the clues, then build.</p>
        <section id="built-result" class="built-result" hidden aria-label="Built Squishdoku puzzle">
          <div class="card-topline"><span>Built puzzle</span><details class="export-menu"><summary>Export</summary><div><button type="button" id="copy-built">Clipboard</button><button type="button" id="image-built">Image</button></div></details></div>
          <p id="built-rating" class="difficulty-rating">Difficulty rating will appear here.</p>
          <div id="built-grid" class="grid" role="grid" aria-label="Built Squishdoku puzzle"></div>
          <div id="custom-walkthrough" class="walkthrough-host"></div>
        </section>
        <div class="legend"><i aria-hidden="true"></i><span>Dashed lines mark the squish seams</span></div>
      </section>
    </main>
  </body>
</html>
